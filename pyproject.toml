[project]
name = "audiotokenizer"
version = "0.2.0"
description = "Approximate audio under a byte budget and compile it into an Impulse Tracker module"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Jakim" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.13",
    "pydantic>=2.13.4",
    "soundfile>=0.12",
    "tqdm==4.69.0",
]

[project.scripts]
audiotokenizer = "audiotokenizer.cli:main"

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "xmodits-py>=0.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiotokenizer"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["audiotokenizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
files = ["audiotokenizer"]
exclude = ["tests"]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
ignored-modules = ["xmodits"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
]
